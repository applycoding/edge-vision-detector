[project]
name = "edge-vision-detector"
version = "0.1.0"
description = "Portfolio demo of a real-time ONNX object-detection pipeline for edge devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arpan Bom" }]
keywords = ["onnxruntime", "object-detection", "edge", "yolo", "jetson"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.16",
  "PyYAML>=6.0",
  "paho-mqtt>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
export = ["ultralytics>=8.3"]

[project.scripts]
edge-vision = "edge_vision.cli:cli_entry"

[project.urls]
Homepage = "https://github.com/applycoding/edge-vision-detector"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
